[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gptqe-symmetry"
version = "0.1.0"
description = "Particle-number symmetry verification for the Generative Quantum Eigensolver (GPT-QE) on CUDA-Q"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Özgür Nazlı", email = "ozgurnazli1996@gmail.com" }]
keywords = [
    "quantum-computing", "quantum-chemistry", "error-mitigation",
    "symmetry-verification", "gpt-qe", "cuda-q", "vqe", "nisq",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

# CUDA-Q is Linux-only; keep it an explicit install step so `pip install .`
# does not fail on unsupported platforms. See the README.
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
cudaq = ["cudaq>=0.8"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/ozgurnazli/gptqe-symmetry"
Thesis = "https://github.com/ozgurnazli/gptqe-symmetry"

[project.scripts]
gptqe-symmetry = "gptqe_symmetry.cli:main"

[tool.setuptools]
packages = ["gptqe_symmetry"]
py-modules = ["gptqe_symmetry_allinone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
